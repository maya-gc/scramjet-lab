% ============================================================================
% scramjet.cfg -- SU2 template for a 2D cold-flow scramjet.
% Placeholder tokens (KEY=value) are filled by cases/build_case.py.
% Target: SU2 v8.5 (option names verified against v8.5.0 source).
% ============================================================================
%
% ---- Problem definition -----------------------------------------------
MESH_FILENAME= @MESH_FILE@
MESH_FORMAT= SU2
SOLVER= @SOLVER@
KIND_TURB_MODEL= SST
MATH_PROBLEM= DIRECT
RESTART_SOL= @RESTART@
SOLUTION_FILENAME= @SOLUTION_FILE@
RESTART_FILENAME= restart_flow
SYSTEM_MEASUREMENTS= SI

% ---- Freestream --------------------------------------------------------
MACH_NUMBER= @MACH@
FREESTREAM_PRESSURE= @P_INF@
FREESTREAM_TEMPERATURE= @T_INF@
AOA= 0.0
SIDESLIP_ANGLE= 0.0
REYNOLDS_NUMBER= @REYNOLDS@
REYNOLDS_LENGTH= @REF_LENGTH@
FREESTREAM_TURBULENCEINTENSITY= @TURB_INT@
FREESTREAM_TURB2LAMVISCRATIO= @TURB_VR@

% ---- Fluid model --------------------------------------------------------
FLUID_MODEL= STANDARD_AIR
GAMMA_VALUE= @GAMMA@
GAS_CONSTANT= @R_GAS@
VISCOSITY_MODEL= SUTHERLAND
MU_REF= 1.716E-5
MU_T_REF= 273.15
SUTHERLAND_CONSTANT= 110.4

% ---- Reference values ----------------------------------------------------
REF_DIMENSIONALIZATION= FREESTREAM_PRESS_EQ_ONE
REF_AREA= @REF_AREA@
REF_LENGTH= @REF_LENGTH@

% ---- Boundary conditions --------------------------------------------------
% inflow  : supersonic, (marker, T, p, Vx, Vy, Vz) imposed
% outflow : supersonic, extrapolated (nozzle exit must stay M > 1)
% walls   : Euler stage uses slip walls; RANS stage uses no-slip adiabatic
MARKER_SUPERSONIC_INLET= ( inflow, @T_INF@, @P_INF@, @V_INF_X@, 0.0, 0.0 )
MARKER_SUPERSONIC_OUTLET= ( outflow )
MARKER_EULER= @INVISCID_WALL@
MARKER_HEATFLUX= @VISCOUS_WALL@
MARKER_MONITORING= ( body, cowl, strut )
MARKER_PLOTTING= ( body, cowl, strut )

% ---- Numerical methods -----------------------------------------------------
NUM_METHOD_GRAD= GREEN_GAUSS
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= @MUSCL@
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO
TIME_DISCRE_FLOW= EULER_IMPLICIT
TIME_DISCRE_TURB= EULER_IMPLICIT
CFL_NUMBER= @CFL@
CFL_ADAPT= NO
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= @LINEAR_ERROR@
LINEAR_SOLVER_ITER= 20

% ---- Convergence -----------------------------------------------------------
% NOTE: CONV_RESIDUAL_MINVAL is log10 of the residual
CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= @RESIDUAL_TARGET@
CONV_STARTITER= 200
ITER= @MAX_ITER@

% ---- Monitoring -------------------------------------------------------------
SCREEN_OUTPUT= ( INNER_ITER, RMS_DENSITY, RMS_ENERGY, RMS_MOMENTUM-X, RMS_MOMENTUM-Y, RMS_TKE, LIFT, DRAG )

% ---- Output -----------------------------------------------------------------
VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE )
OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_PARAVIEW )